# DarwinTV — Pi 5 EEPROM bootloader config for TFTP first boot.
#
# Apply on the Pi with:
#   sudo rpi-eeprom-config --edit
# (or copy this file and use: sudo rpi-eeprom-config --apply eeprom-netboot.conf)
#
# Host IP detected 2026-11-08: 192.168.9.103 (enp37s0).
# Use a DHCP reservation or a static host address; update TFTP_IP if it changes.

BOOT_ORDER=0xf12
BOOT_UART=1
TFTP_IP=192.168.9.103
TFTP_PREFIX=1
TFTP_PREFIX_STR=darwintv/
