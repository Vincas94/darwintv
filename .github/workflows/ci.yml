name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Check
        run: ./scripts/check.sh

  bootloader:
    name: bootloader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Build Pi 5
        run: make loader BOARD=pi5
      - name: Build QEMU raspi4b
        run: make loader BOARD=qemu-raspi4b
      - name: Build QEMU virt
        run: make loader BOARD=qemu-virt
      - name: Inspect
        run: |
          file bootloader/build/pi5/loader.elf
          test -s bootloader/build/pi5/loader8.img
          test -s bootloader/build/qemu-raspi4b/loader8.img
          test -s bootloader/build/qemu-virt/loader.elf
          size=$(stat -c%s bootloader/build/pi5/loader8.img)
          echo "loader8.img = $size bytes"
          test "$size" -lt 1048576

  qemu:
    name: qemu smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm
          pip install -e ".[dev]"
      - name: Build loader
        run: make loader BOARD=qemu-virt
      - name: Build test payload
        run: |
          python - <<'PY'
          from pathlib import Path
          from tests.test_payload import make_macho

          image, _, _ = make_macho()
          Path("/tmp/macho.bin").write_bytes(image)
          PY
          python -m tools.payload pack --kernel /tmp/macho.bin --out /tmp/payload.bin
      - name: Run virt
        run: |
          timeout 8 qemu-system-aarch64 -M virt,gic-version=2 -cpu cortex-a76 -smp 4 -m 2G \
            -kernel bootloader/build/qemu-virt/loader.elf \
            -device loader,file=/tmp/payload.bin,addr=0x48000000,force-raw=on \
            -serial stdio -display none -monitor none > /tmp/virt.log 2>&1 || true
          cat /tmp/virt.log
          grep -q 'DarwinTV loader' /tmp/virt.log
          grep -q 'payload:  DTVPLD01' /tmp/virt.log
          grep -q 'payload valid' /tmp/virt.log
